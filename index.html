<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Abstract Studio 创业模拟器</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="app"></div>
  <!--
    弹窗层：**必须放在 #app 之外**。
    #app 的主循环每帧都会 `innerHTML = ...` 整个重建，挂在里面的弹窗会在 16ms 内被擦掉
    （实测的后果：路线抉择选不了、事件弹窗看不见、心结清算做不完 → 游戏无法通关）。
  -->
  <div id="overlay"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
